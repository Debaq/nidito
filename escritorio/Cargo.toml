[package]
name = "nidito"
version = "0.1.0"
edition = "2021"
description = "Escritorio infantil con ventanas, voz y juegos simples"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
tiny-skia = "0.11"
fontdue = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
zune-jpeg = { version = "0.4", default-features = false }
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis"] }
web-time = "1"

# Solo en el computador: cámara (V4L2)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
v4l = { version = "0.14.0", default-features = false, features = ["v4l2"] }
hound = "3.5"
ratatui = "0.29"

# Versión web (WebAssembly). wasm-bindgen fijo: tiene que ser la misma versión que el wasm-bindgen-cli instalado.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Storage", "Response", "Location", "SpeechSynthesis", "SpeechSynthesisUtterance"] }
cpal = { version = "0.15", features = ["wasm-bindgen"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
