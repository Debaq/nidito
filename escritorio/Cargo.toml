[package]
name = "nidito"
version = "0.1.0"
edition = "2021"
description = "Escritorio infantil con ventanas, voz y juegos simples"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
tiny-skia = "0.11"
fontdue = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
zune-jpeg = { version = "0.4", default-features = false }
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis"] }
v4l = { version = "0.14.0", default-features = false, features = ["v4l2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
