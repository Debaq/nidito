UI menu.c32
MENU TITLE Nidito
MENU CLEAR
DEFAULT nidito
TIMEOUT 80

LABEL nidito
MENU LABEL Probar Nidito (sin instalar) / Try Nidito
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0

LABEL instalar
MENU LABEL Instalar Nidito (BORRA el disco) / Install (ERASES the disk)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n quiet splash loglevel=3 rd.udev.log_level=3 nidito.instalar

LABEL apagar
MENU LABEL Apagar / Power off
COM32 poweroff.c32
