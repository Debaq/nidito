Section "ServerFlags"
    # que no se pueda salir con Ctrl+Alt+Retroceso ni cambiar de consola
    Option "DontZap" "true"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "video"
    Driver "modesetting"
    # Nidito dibuja todo por CPU; la aceleración del GMA 3150 no aporta
    Option "AccelMethod" "none"
EndSection
