# Configuración genérica de Nidito (se instala en /etc/nidito.conf).
# Para personalizar con el nombre de un niño usa ./personalizar.sh (crea perfiles/<usuario>.conf).
# nombre vacío = saludo genérico ("¡Hola!").
nombre=
apodo=
voz=es-419
voz_en=en-us
# minutos de juegos por día (0 = sin tope). Pintar, Letras, Escribir y Mi clase no cuentan.
juegos_min=20
# cada cuántos minutos de uso se pide descansar la vista 20 segundos (0 = nunca)
pausa_ojos=20
# cumpleaños como DD-MM (p. ej. 15-03): ese día hay globos, saludo especial y "Cumpleaños feliz"
cumpleanos=
# Estos ajustes también se cambian en el menú de adultos (Ctrl+Alt+P > Ajustes);
# lo que se cambie ahí queda en ~/.config/nidito.conf y manda sobre este archivo.
# sal= y clave= los agrega el instalador (o: sudo nidito-clave)
